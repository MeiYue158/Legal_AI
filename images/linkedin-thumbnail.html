<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Legal AI — LinkedIn Thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #e9edf2;
    font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', sans-serif;
  }
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 12px;
  }
  #canvas {
    width: 1200px;
    height: 675px;
    background: #ffffff;
  }
  svg { display: block; }
</style>
</head>
<body>
  <div class="stage">
    <div id="canvas">
      <svg viewBox="0 0 1200 675" width="1200" height="675" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#94a0ae"></path>
          </marker>
        </defs>

        <!-- card ground -->
        <rect x="1" y="1" width="1198" height="673" rx="14" fill="#ffffff" stroke="#e3e7ec" stroke-width="1.5"></rect>

        <!-- header -->
        <text x="600" y="98" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="-0.5" fill="#161c26">Legal AI</text>
        <text x="600" y="130" text-anchor="middle" font-size="17" font-weight="600" fill="#3d4552">Research &amp; Evaluation Platform</text>
        <text x="600" y="153" text-anchor="middle" font-size="13" font-weight="400" fill="#8a93a1">Evidence-Grounded Legal Research</text>

        <!-- pipeline boxes: y=258 h=78, x: 57,280,503,726,949 w=195 -->
        <g font-family="Plus Jakarta Sans, sans-serif">

          <!-- 1 Legal Query -->
          <rect x="57" y="258" width="195" height="78" rx="12" fill="#f7f8fa" stroke="#d7dce3" stroke-width="1.5"></rect>
          <text x="154.5" y="303" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2330">Legal Query</text>

          <!-- 2 Hybrid Retrieval -->
          <rect x="280" y="258" width="195" height="78" rx="12" fill="#f7f8fa" stroke="#d7dce3" stroke-width="1.5"></rect>
          <text x="377.5" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2330">Hybrid Retrieval</text>
          <text x="377.5" y="318" text-anchor="middle" font-size="12.5" font-weight="500" fill="#7a8492">Dense + BM25</text>

          <!-- 3 Fusion and Reranking -->
          <rect x="503" y="258" width="195" height="78" rx="12" fill="#f7f8fa" stroke="#d7dce3" stroke-width="1.5"></rect>
          <text x="600.5" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2330">Fusion &amp;</text>
          <text x="600.5" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2330">Reranking</text>

          <!-- 4 Grounded LLM Answer -->
          <rect x="726" y="258" width="195" height="78" rx="12" fill="#f7f8fa" stroke="#d7dce3" stroke-width="1.5"></rect>
          <text x="823.5" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2330">Grounded LLM</text>
          <text x="823.5" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2330">Answer</text>

          <!-- 5 Citation Verification (accent) -->
          <rect x="949" y="258" width="195" height="78" rx="12" fill="#e4f1e9" stroke="#4c8266" stroke-width="2"></rect>
          <text x="1046.5" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#2b543e">Citation</text>
          <text x="1046.5" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#2b543e">Verification</text>
        </g>

        <!-- flow arrows -->
        <g stroke="#94a0ae" stroke-width="2">
          <line x1="252" y1="297" x2="276" y2="297" marker-end="url(#arrow)"></line>
          <line x1="475" y1="297" x2="499" y2="297" marker-end="url(#arrow)"></line>
          <line x1="698" y1="297" x2="722" y2="297" marker-end="url(#arrow)"></line>
          <line x1="921" y1="297" x2="945" y2="297" marker-end="url(#arrow)"></line>
        </g>

        <!-- evaluation & failure tracing band, spanning boxes 2-3 -->
        <line x1="377.5" y1="336" x2="377.5" y2="354" stroke="#b7bec8" stroke-width="1.5"></line>
        <line x1="600.5" y1="336" x2="600.5" y2="354" stroke="#b7bec8" stroke-width="1.5"></line>
        <rect x="266" y="354" width="446" height="42" rx="21" fill="#ffffff" stroke="#b7bec8" stroke-width="1.5" stroke-dasharray="5 4"></rect>
        <text x="489" y="380" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="0.02em" fill="#5b6472">Evaluation &amp; Failure Tracing</text>

        <!-- footer -->
        <text x="600" y="618" text-anchor="middle" font-size="12.5" font-weight="600" letter-spacing="0.09em" fill="#8a93a1">RAG EVALUATION · FAILURE TRACING · CITATION VERIFICATION</text>
      </svg>
    </div>
  </div>
</body>
</html>
